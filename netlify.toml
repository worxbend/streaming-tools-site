[build]
  # Static site — nothing to compile. Everything in the repo root is published as-is.
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Long-cache the fingerprint-free static assets but always revalidate HTML,
# so a redeploy is picked up immediately.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
